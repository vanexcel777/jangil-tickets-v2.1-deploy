<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scanner — Jangil Tickets</title><link rel="stylesheet" href="/styles.css"></head><body><div id="app"></div><script src="/app.js"></script><script>
document.querySelector('#app').innerHTML=JT.nav()+`<main class="scanner shell"><div class="eyebrow">Contrôle d'entrée</div><h1>Scanner un billet</h1><div class="card scanbox"><div class="scanViewport" id="viewport"><span class="muted">Caméra inactive</span></div><div class="spacer"></div><button class="btn primary" id="start">Activer la caméra</button><div class="spacer"></div><form id="manual" class="row"><input id="token" placeholder="Ou saisir TKT-... / token" style="flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:#0d0f14;color:white"><button class="btn">Valider</button></form><div id="result"></div></div></main>`+JT.footer();let stream,detector,running=false,last='';async function check(v){if(!v||v===last)return;last=v;try{let r=await JT.api('/api/checkin',{method:'POST',body:JSON.stringify({token:v})});document.querySelector('#result').innerHTML=`<div class="result ok">✅ VALIDE<br><span class="small">${r.type} • ${r.ticket}</span></div>`}catch(e){let d=e.data||{};document.querySelector('#result').innerHTML=`<div class="result bad">${d.status==='already_used'?'⛔ DÉJÀ UTILISÉ':'❌ INVALIDE'}<br><span class="small">${d.ticket||''}</span></div>`}setTimeout(()=>last='',1800)}document.querySelector('#manual').onsubmit=e=>{e.preventDefault();check(document.querySelector('#token').value.trim());document.querySelector('#token').value=''};document.querySelector('#start').onclick=async()=>{if(!('BarcodeDetector'in window)){alert('Scanner QR natif non disponible dans ce navigateur. Utilisez Chrome récent ou la saisie manuelle.');return}detector=new BarcodeDetector({formats:['qr_code']});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});let v=document.createElement('video');v.autoplay=true;v.playsInline=true;v.srcObject=stream;let vp=document.querySelector('#viewport');vp.innerHTML='';vp.appendChild(v);running=true;scan(v)};async function scan(v){while(running){try{let codes=await detector.detect(v);if(codes[0])await check(codes[0].rawValue)}catch{}await new Promise(r=>setTimeout(r,350))}}
</script></body></html>
