<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organisateur — Jangil Tickets</title><link rel="stylesheet" href="/styles.css"></head><body><div id="app"></div><script src="/app.js"></script><script>
async function load(){let s=await JT.api('/api/admin/summary');document.querySelector('#app').innerHTML=JT.nav('admin')+`<main class="shell section"><div class="row"><div><div class="eyebrow">Back office</div><h1>Dashboard organisateur</h1></div><button class="btn primary" id="newEvent">+ Nouvel événement</button></div><div class="stats"><div class="card stat"><span class="muted">CA encaissé</span><b>${JT.money(s.revenue)}</b></div><div class="card stat"><span class="muted">Billets vendus</span><b>${s.tickets_sold}</b></div><div class="card stat"><span class="muted">Entrées</span><b>${s.checkins}</b></div><div class="card stat"><span class="muted">Événements</span><b>${s.events.length}</b></div></div><section class="section"><div class="card buybox"><h2>Dernières commandes</h2><table class="table"><thead><tr><th>Référence</th><th>Client</th><th>Total</th><th>Statut</th></tr></thead><tbody>${s.orders.map(o=>`<tr><td>${o.reference}</td><td>${o.customer_name}<br><span class="muted small">${o.customer_email}</span></td><td>${JT.money(o.amount)}</td><td><span class="badge ${o.payment_status==='paid'?'ok':''}">${o.payment_status}</span></td></tr>`).join('')||'<tr><td colspan=4>Aucune commande</td></tr>'}</tbody></table></div></section><section id="creator" class="section" style="display:none"><div class="card buybox"><h2>Créer un événement</h2><form id="eventForm" class="form"><div class="two"><div class="field"><label>Nom</label><input name="title" required></div><div class="field"><label>Lieu</label><input name="venue" required></div></div><div class="two"><div class="field"><label>Date et heure</label><input name="starts_at" type="datetime-local" required></div><div class="field"><label>Capacité</label><input name="capacity" type="number" value="500" min="1" required></div></div><div class="field"><label>Description</label><textarea name="description"></textarea></div><div class="two"><div class="field"><label>Billet standard — prix Rs</label><input name="price" type="number" value="800" required></div><div class="field"><label>Quantité</label><input name="quantity" type="number" value="500" required></div></div><button class="btn primary">Publier</button></form></div></section></main>`+JT.footer();document.querySelector('#newEvent').onclick=()=>{let e=document.querySelector('#creator');e.style.display=e.style.display==='none'?'block':'none';e.scrollIntoView({behavior:'smooth'})};document.querySelector('#eventForm').onsubmit=async ev=>{ev.preventDefault();let f=new FormData(ev.target);await JT.api('/api/admin/events',{method:'POST',body:JSON.stringify({title:f.get('title'),venue:f.get('venue'),starts_at:f.get('starts_at')+':00+04:00',capacity:+f.get('capacity'),description:f.get('description'),ticket_types:[{name:'Standard',price:+f.get('price'),quantity:+f.get('quantity')}]})});load()}}
load().catch(e=>document.querySelector('#app').innerHTML=e.message)
</script></body></html>
