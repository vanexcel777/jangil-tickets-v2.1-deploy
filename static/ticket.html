<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Votre billet — Jangil Tickets</title><link rel="stylesheet" href="/styles.css"></head><body><div id="app"></div><script src="/app.js"></script><script>
(async()=>{let ref=new URLSearchParams(location.search).get('order');let x=await JT.api('/api/orders/'+ref);document.querySelector('#app').innerHTML=JT.nav()+`<main class="shell"><div class="ticket"><div class="ticketHead"><div class="eyebrow">Paiement confirmé</div><h1>Vos e-tickets</h1><div>Commande ${x.order.reference}</div></div><div class="ticketBody"><p>Présentez le QR code à l'entrée. Chaque billet est utilisable une seule fois.</p>${x.tickets.map(t=>`<div class="ticketItem"><div><div class="eyebrow">${t.type_name}</div><h2>${t.title}</h2><p>${t.venue}<br>${new Date(t.starts_at).toLocaleString('fr-FR')}</p><b>${t.public_id}</b>${t.checked_in_at?'<p class="badge ok">Déjà scanné</p>':''}</div><img src="/api/tickets/${t.public_id}/qr" alt="QR code billet"></div>`).join('')}<button class="btn" onclick="print()">Imprimer / PDF</button></div></div></main>`+JT.footer()})().catch(e=>document.querySelector('#app').innerHTML='<p class="shell">'+e.message+'</p>')
</script></body></html>
