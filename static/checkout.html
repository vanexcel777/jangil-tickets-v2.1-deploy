<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paiement — Jangil Tickets</title><link rel="stylesheet" href="/styles.css"></head><body><div id="app"></div><script src="/app.js"></script><script>
const c=JSON.parse(sessionStorage.cart||'null'); if(!c) location.href='/'; else {const total=c.items.reduce((s,i)=>s+c.event.ticket_types.find(t=>t.id==i.ticket_type_id).price*i.qty,0);document.querySelector('#app').innerHTML=JT.nav()+`<main class="shell eventHero"><section><div class="eyebrow">Checkout sécurisé</div><h1>Finaliser la commande</h1><div class="card buybox"><form id="form" class="form"><div class="two"><div class="field"><label>Nom complet</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div></div><div class="field"><label>Téléphone</label><input name="phone"></div><div class="field"><label>Paiement</label><select name="payment_method"><option value="demo">Mode démo — valider instantanément</option><option value="mcb">MCB MPGS / Juice — production</option></select></div><div class="notice"><b>Mode démo :</b> aucun argent n'est prélevé. Il sert à tester toute la chaîne QR → contrôle d'entrée. Le mode MCB s'active avec les identifiants marchand.</div><button class="btn primary">Payer ${JT.money(total)}</button></form></div></section><aside class="card buybox"><h2>${c.event.title}</h2>${c.items.map(i=>{let t=c.event.ticket_types.find(x=>x.id==i.ticket_type_id);return `<div class="ticketline row"><span>${i.qty} × ${t.name}</span><b>${JT.money(i.qty*t.price)}</b></div>`}).join('')}<div class="ticketline row"><span>Total</span><span class="total">${JT.money(total)}</span></div></aside></main>`+JT.footer();document.querySelector('#form').onsubmit=async ev=>{ev.preventDefault();let f=new FormData(ev.target),btn=ev.target.querySelector('button');btn.disabled=true;btn.textContent='Traitement…';try{let r=await JT.api('/api/checkout',{method:'POST',body:JSON.stringify({name:f.get('name'),email:f.get('email'),phone:f.get('phone'),payment_method:f.get('payment_method'),items:c.items})});if(r.next){sessionStorage.removeItem('cart');location.href=r.next}else alert('Paiement en attente')}catch(e){alert(e.message);btn.disabled=false;btn.textContent='Réessayer'}}}
</script></body></html>
